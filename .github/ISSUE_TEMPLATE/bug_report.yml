name: 问题报告 / Bug report
description: 采集不到数据、数字不对、看板或 CLI 行为异常
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。信息越完整，越容易定位问题；缺少必填信息的 issue 可能无法处理。

        English reports are welcome.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: '已更新到最新代码（git pull 后重新 npm ci），问题仍然存在'
          required: true
        - label: '已搜索[已有 issue](https://github.com/rumoii/token-lens/issues?q=is%3Aissue)，包括已关闭的，没有重复'
          required: true
        - label: 这个 issue 只报告一个问题
          required: true
        - label: '了解 token-lens 是纯本地工具，不接受云端账户、数据上传、遥测、排行榜或给其他工具目录装钩子类需求'
          required: true

  - type: dropdown
    id: ai_usage
    attributes:
      label: 'AI 使用说明 / AI disclosure'
      description: '写这个 issue 时有没有借助 AI。用了也没关系，如实说明即可，见 CONTRIBUTING.md 的「使用 AI」一节。'
      options:
        - 没有使用 AI
        - 只用 AI 整理或翻译文字，问题是我自己遇到的
        - '问题由 AI 发现或分析（例如 AI 代码审查），我已自己确认过'
        - 问题由 AI 发现或分析，我还没有自己确认
    validations:
      required: true

  - type: input
    id: ai_model
    attributes:
      label: 使用的 AI 工具和模型
      description: '用了 AI 就必须填，写具体型号和版本，不要只写“AI”。'
      placeholder: 'claude-sonnet-4-5 / gpt-5-codex'

  - type: dropdown
    id: run_mode
    attributes:
      label: 运行方式
      description: 问题发生时 token-lens 是怎么跑起来的。
      options:
        - 'npm start（源码启动看板）'
        - 'npm run collect 或 npm run summary（CLI）'
        - npm link 后用 lens 命令
        - node bin/lens.js 直接调用
        - 其他或不确定
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node 版本
      description: 'node -v 的输出。token-lens 需要 Node >= 24.21.0（核心用 node:sqlite）。'
      placeholder: v24.21.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 含版本与架构。
      placeholder: 'Windows 11 24H2 x64 / Ubuntu 24.04 / macOS 15.3'
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 采集不到日志或数据缺失
        - 数据不准或重复
        - 成本或价格计算
        - 看板界面
        - CLI
        - 安装或构建
        - 其他
    validations:
      required: true

  - type: input
    id: tools
    attributes:
      label: 涉及的 AI 编码工具
      description: 客户端名称与版本；涉及多个用顿号隔开。
      placeholder: 'Claude Code 2.0.14、Codex CLI 0.45.0'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动或采集开始，一步步写出怎样触发。
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 发生了什么；CLI 或看板有报错请照原文贴出。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或输出
      description: 'issue 是公开的：不要贴 api-token、密钥、绝对路径里的用户名或公司内网路径。数据目录默认 ~/.token-lens，可用 --data-dir / TOKEN_LENS_DATA_DIR / DB_PATH 改，贴路径前先检查。'
      placeholder: '粘贴 CLI 输出片段或 server 日志，用代码块围栏'

  - type: textarea
    id: extra
    attributes:
      label: 截图或其他补充
