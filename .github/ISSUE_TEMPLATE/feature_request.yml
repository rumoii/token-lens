name: 功能建议 / Feature request
description: 建议新功能或改进现有功能
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        English requests are welcome.

        token-lens 是纯本地工具，云端化类需求见下方确认项。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: '已搜索[已有 issue](https://github.com/rumoii/token-lens/issues?q=is%3Aissue)，包括已关闭的，没有重复'
          required: true
        - label: '了解 token-lens 纯本地运行，不接受云端账户、数据上传、遥测、排行榜或给其他工具目录装钩子类需求'
          required: true
        - label: '这个 issue 只报告一个问题'
          required: true

  - type: dropdown
    id: ai_usage
    attributes:
      label: 'AI 使用说明 / AI disclosure'
      description: '写这个 issue 时有没有借助 AI。用了也没关系，如实说明即可，见 CONTRIBUTING.md 的「使用 AI」一节。'
      options:
        - 没有使用 AI
        - 只用 AI 整理或翻译文字
        - 建议内容主要由 AI 生成或分析
    validations:
      required: true

  - type: input
    id: ai_model
    attributes:
      label: 使用的 AI 工具和模型
      description: '用了 AI 就必须填，写具体型号和版本，不要只写“AI”。'
      placeholder: 'claude-sonnet-4-5 / gpt-5-codex'

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景，以及现在哪里不方便。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法
      description: 希望 token-lens 怎样处理。

  - type: textarea
    id: workaround
    attributes:
      label: 现在的替代办法
      description: 目前是怎么绕过这个问题的，或者其他工具是怎么做的。

  - type: textarea
    id: examples
    attributes:
      label: 相关客户端或示例
