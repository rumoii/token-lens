name: Desktop checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'specs/**'
      - '.github/workflows/desktop.yml'
      - 'scripts/smoke-desktop.py'
      - 'scripts/generate-desktop-notices.dart'
      - 'scripts/licenses/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'specs/**'
      - '.github/workflows/desktop.yml'
      - 'scripts/smoke-desktop.py'
      - 'scripts/generate-desktop-notices.dart'
      - 'scripts/licenses/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            rust_target: x86_64-pc-windows-msvc
            python: python
            executable: build/windows/x64/runner/Release/token-lens.exe
          - os: macos-latest
            target: macos
            rust_target: aarch64-apple-darwin
            python: python3
            executable: build/macos/Build/Products/Release/Token Lens.app/Contents/MacOS/Token Lens
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set isolated runner environment
        run: |
          printf '%s\n' \
            "TEMP=$RUNNER_TEMP" \
            "TMP=$RUNNER_TEMP" \
            "TMPDIR=$RUNNER_TEMP" \
            "TOKEN_LENS_PREVIEW_DATA_DIR=$RUNNER_TEMP/token-lens-preview-data" \
            "TOKEN_LENS_PREVIEW_HOME=$RUNNER_TEMP/token-lens-preview-home" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy

      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare isolated test directories
        run: |
          ${{ matrix.python }} - <<'PY'
          import os
          from pathlib import Path

          for variable in ['TOKEN_LENS_PREVIEW_DATA_DIR', 'TOKEN_LENS_PREVIEW_HOME']:
              Path(os.environ[variable]).mkdir(parents=True, exist_ok=True)
          PY

      - name: Check Rust
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked

      - name: Check Flutter
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build release
        run: flutter build ${{ matrix.target }} --release --no-pub

      - name: Generate Rust license texts
        run: >-
          dart --packages=.dart_tool/package_config.json ../scripts/generate-desktop-notices.dart
          --rust-licenses "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt" --target ${{ matrix.rust_target }}

      - name: Check lockfiles
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock

      - name: Smoke test desktop ingestion
        timeout-minutes: 3
        run: ${{ matrix.python }} ../scripts/smoke-desktop.py "${{ matrix.executable }}"
