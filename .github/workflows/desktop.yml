name: Desktop checks

on:
  workflow_call:
    inputs:
      checks_only:
        type: boolean
        default: false
  pull_request:
    paths:
      - 'app/**'
      - 'specs/**'
      - 'test/fixtures/**'
      - '.github/workflows/desktop.yml'
      - 'scripts/smoke-desktop.py'
      - 'scripts/desktop-dev.py'
      - 'scripts/desktop_demo.py'
      - 'scripts/desktop_env.py'
      - 'scripts/verify-desktop-zip.py'
      - 'scripts/generate-desktop-notices.dart'
      - 'scripts/licenses/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'specs/**'
      - 'test/fixtures/**'
      - '.github/workflows/desktop.yml'
      - 'scripts/smoke-desktop.py'
      - 'scripts/desktop-dev.py'
      - 'scripts/desktop_demo.py'
      - 'scripts/desktop_env.py'
      - 'scripts/verify-desktop-zip.py'
      - 'scripts/generate-desktop-notices.dart'
      - 'scripts/licenses/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            rust_target: x86_64-pc-windows-msvc
            python: python
            executable: build/windows/x64/runner/Release/token-lens.exe
          - os: macos-latest
            target: macos
            rust_target: aarch64-apple-darwin
            python: python3
            executable: build/macos/Build/Products/Release/Token Lens.app/Contents/MacOS/Token Lens
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin

      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare locked Cargo dependencies
        run: |
          cargo fetch --manifest-path rust/Cargo.toml --locked \
            --target x86_64-pc-windows-msvc --target aarch64-apple-darwin

      - name: Run desktop checks
        run: ${{ matrix.python }} ../scripts/desktop-dev.py check

      - name: Build release
        if: ${{ !inputs.checks_only }}
        run: flutter build ${{ matrix.target }} --release --no-pub

      - name: Generate Rust license texts
        if: ${{ !inputs.checks_only }}
        run: >-
          dart --packages=.dart_tool/package_config.json ../scripts/generate-desktop-notices.dart
          --rust-licenses "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt" --target ${{ matrix.rust_target }}

      - name: Check lockfiles
        if: ${{ !inputs.checks_only }}
        run: git diff --exit-code HEAD -- pubspec.lock rust/Cargo.lock

      - name: Smoke test desktop ingestion
        if: ${{ !inputs.checks_only }}
        timeout-minutes: 3
        run: ${{ matrix.python }} ../scripts/smoke-desktop.py "${{ matrix.executable }}"
