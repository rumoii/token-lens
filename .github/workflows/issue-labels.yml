# 所需标签需在仓库一次性创建后，此 workflow 才能正常打标。
# 需要的标签：bug、enhancement、采集、数据、价格、界面、CLI、安装、AI 辅助、待确认。
# gh issue edit --add-label 遇到不存在的标签会失败，所以标签缺失时本 workflow 会报错而不是静默跳过。
name: Issue labels

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

concurrency:
  group: issue-labels-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Sync labels from issue form answers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
          PREVIOUS_BODY: ${{ github.event.changes.body.from }}
        run: |
          $maps = @{
            '问题类型' = @{
              '采集不到日志或数据缺失' = '采集'
              '数据不准或重复' = '数据'
              '成本或价格计算' = '价格'
              '界面' = '界面'
              '看板界面' = '界面'
              'CLI（旧版）' = 'CLI'
              'CLI 或导出' = 'CLI'
              'CLI' = 'CLI'
              '安装、启动或构建' = '安装'
              '安装或构建' = '安装'
            }
          }
          function Get-Labels([string]$body) {
            $labels = @()
            if (-not $body) { return $labels }
            $field = { param($title) if ($body -match "(?m)^### $([regex]::Escape($title))\r?\n\r?\n(.+?)\r?$") { $Matches[1].Trim() } }
            foreach ($title in $maps.Keys) {
              $value = & $field $title
              if ($value -and $maps[$title].ContainsKey($value)) { $labels += $maps[$title][$value] }
            }
            $ai = & $field 'AI 使用说明 / AI disclosure'
            if ($ai -and $ai -ne '没有使用 AI' -and $ai -ne '_No response_') { $labels += 'AI 辅助' }
            if ($ai -like '*还没有自己确认*') { $labels += '待确认' }
            return $labels
          }
          $wanted = @(Get-Labels $env:BODY)
          $stale = @(Get-Labels $env:PREVIOUS_BODY | Where-Object { $_ -notin $wanted })
          "Add: $($wanted -join ', ')"; "Remove: $($stale -join ', ')"
          $arguments = @('issue', 'edit', $env:NUMBER)
          if ($wanted.Count) { $arguments += @('--add-label', ($wanted -join ',')) }
          if ($stale.Count) { $arguments += @('--remove-label', ($stale -join ',')) }
          if ($arguments.Count -gt 3) { gh @arguments; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
