<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Lens · Local usage insights</title>
    <meta name="description" content="Explore token usage, estimated costs and coding sessions on your own computer." />
    <link href="/favicon.svg?v=2" rel="icon" type="image/svg+xml" />
    <link href="/favicon-32.png?v=2" rel="icon" sizes="32x32" type="image/png" />
    <link href="/favicon-16.png?v=2" rel="icon" sizes="16x16" type="image/png" />
    <link href="/apple-touch-icon.png?v=2" rel="apple-touch-icon" sizes="180x180" />
    <link href="/favicon.ico?v=2" rel="shortcut icon" />
    <script>
      (() => {
        let choice;
        try { choice = localStorage.getItem('token-lens-theme'); } catch {}
        const dark = choice === 'dark' || (choice !== 'light' && typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.jsx" type="module"></script>
  </body>
</html>
