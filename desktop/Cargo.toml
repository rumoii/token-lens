[package]
name = "token-lens-desktop"
version = "1.0.1"
edition = "2024"
default-run = "token-lens"

[[bin]]
name = "token-lens"
path = "src/main.rs"

[[bin]]
name = "pack"
path = "src/pack.rs"

[dependencies]
tao = "=0.37.2"
wry = "=0.57.1"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
lzma-rust2 = { version = "=0.22.0", default-features = false, features = ["std", "encoder"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys ={ version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
