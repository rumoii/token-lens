openhands:
  description: "OpenHands CLI 原生会话；不支持 SDK 自定义脚本、ACP、服务端／容器／远程 runtime"
  source_revision: "OpenHands/OpenHands-CLI@283c6ac3610f4299f405f7389f65766dcb83e12a；uv.lock 锁定 SDK v1.28.1，对应 edaac806d1599a4ee1662fd4008fbcd7b537ecd1"
  locations:
