# Token-Lens 外部日志事实规范 (Observable Facts Specification)
# 说明：本文件仅记录各 AI 编码工具在操作系统中客观生成的日志路径与 JSON 结构事实，不包含任何业务代码。
# 净室原则：后续所有 Adapter 均基于本事实规范从零独立编写，严禁参考或复用任何旧项目源码。

claude_code:
  description: "Anthropic Claude Code CLI 工具的本地项目会话记录"
  locations:
    win32: "%USERPROFILE%\\.claude\\projects"
    darwin: "~/.claude/projects"
    linux: "~/.claude/projects"
  file_pattern: "**/*.jsonl"
  format: "JSONL (单行一个 JSON 对象)"
  key_fields:
    type: "$.type (通常为 message/response)"
    session_id: "$.sessionId"
    timestamp: "$.timestamp (ISO8601 字符串)"
    model: "$.message.model 或 $.model"
    usage:
      input_tokens: "$.message.usage.input_tokens"
      output_tokens: "$.message.usage.output_tokens"
      cache_read_tokens: "$.message.usage.cache_read_input_tokens"
      cache_write_tokens: "$.message.usage.cache_creation_input_tokens"
  request_timing:
    timing_rev: 3
    fields: "type=api-request 的唯一 id/timestamp，经 requestRef 关联至消息最后有效 usage 块 timestamp（ISO 毫秒）"
    first_output: "同一消息和 requestRef 下唯一的 assistant apiBlockIndex=0，message.content[0].type=thinking 且 thinkingDurationMs 为正数时，用该行 timestamp 减去思考时长（毫秒）；该行可无 usage"
    method: "log_timestamps"
    scope: "request"
    completion: "最后有效 usage 块 message.stop_reason 为非空字符串时 completed，否则 partial；只取该块标志，不继承早先块，不从后续消息推断结束"
    limits: "首字与整次使用同一 api-request 起点；首字须大于零且不超过整次耗时，生成时长为 NULL。缺关联、缺消息 id、同请求多消息、重复请求 id、引用冲突、非正差值或配对歧义所影响的指标为 NULL"

codex_cli:
  description: "OpenAI Codex CLI 工具的本地会话记录与 Rollout"
  locations:
    win32: "%USERPROFILE%\\.codex\\sessions"
    darwin: "~/.codex/sessions"
    linux: "~/.codex/sessions"
  file_pattern: "**/rollout-*.jsonl (或 .jsonl.zst 压缩文件)"
  format: "JSONL"
  evidence: "真实 rollout 会话样本：含 usage 的行逐条核对，cached 合计与客户端 total_tokens 对平"
  provider_evidence: "https://github.com/openai/codex/blob/b7f7e7f7e85a1c63e520f27cac42b836f242d9f7/codex-rs/protocol/src/protocol.rs#L3378-L3392"
  key_fields:
    provider: "$.payload.model_provider（type=session_meta）；只在该会话内继承，下一 session_meta 缺失则清空，不从模型名推断"
    record_type: "只有 $.type == 'token_usage_record' 的 payload 带 per-response 用量；其余行必须跳过"
    session_id: "$.payload.session_id"
    identity: "Rust revision 5：可靠 response_id 保留 codex|<session>|<response_id>；只按 id 形状判定，去掉开头 resp_ 后为空、全 ASCII 数字或少于 16 字符的 id 不可靠，改用 codex|<session>|<用量行 thread_id>|<原始时间戳>；同一新键按文件内有效用量行顺序加 #2、#3。缺 thread_id 或原始时间戳则用去掉末尾 .zst 的路径 hash＋物理行号。每条新身份 replaces 旧响应键；无 response_id 保持既有位置回退。正常形状长 id 被上游复用时仍按旧 key 合并、原地更新，与 E1 之前相同。Node revision 4 仍保留旧规则，见 docs/development/stats.md「允许的差异」"
    timestamp: "$.timestamp (ISO8601)"
    model: "$.payload.usage.model，缺失时沿用会话内已见的模型名"
    usage:
      input_tokens: "$.payload.usage.input_tokens（**已含** cached_input_tokens）"
      output_tokens: "$.payload.usage.output_tokens"
      cache_read_tokens: "$.payload.usage.cached_input_tokens"
      cache_write_tokens: "落库为 NULL。2026-10 起 usage 带 cache_write_input_tokens，本机样本全为 0；是否含在 input_tokens 里要等非零样本确认，确认前不读"
    redundant_totals:
      - "$.payload.turn_token_usage（本轮累计）"
      - "$.payload.thread_token_usage（整段会话累计）"
      - "$.type == 'event_msg' 且 $.payload.type == 'token_count' 时的 $.payload.info.last_token_usage / total_token_usage"
      - 结论: "四种表示只能取一种，取 $.payload.usage，其余一律不读，否则同一笔用量被计多次"
    cross_check: "usage.input_tokens + usage.output_tokens == usage.total_tokens（真实样本里逐条成立）"
  token_semantics: "cached ⊂ input。落库前须算 input_exclusive = input_tokens - cached_input_tokens；旧实现直接落 input_tokens 且漏读 cached_input_tokens，两个方向都错"
  request_timing:
    timing_rev: 1
    method: "log_timestamps"
    start: "之前最近的边界外层 timestamp：response_item.message role=user、event_msg.item_completed.UserMessage、response_item.function_call_output/custom_tool_call_output、event_msg.task_started/turn_started；developer 消息不是边界"
    first_output: "event_msg.payload.type=item_completed，payload.item.type 为 Reasoning 或 AgentMessage，仅 payload.completed_at_ms 存在且大于 started_at_ms 的项合格，取最小 payload.started_at_ms（Unix 毫秒）；不读正文"
    end: "本次 token_usage_record 的外层 timestamp"
    formula: "ttft_ms=first-start，generation_ms=end-first，分别要求差值>0；timing_output_tokens 取该用量记录 output_tokens"
    limits: "turn_aborted、新回合开始、每条 usage 消费后清空未配对窗口；旧日志没有 started_at_ms 时保持 NULL；零时长项只有隐藏推理的完成时刻，缺完成时间/完成早于开始也跳过，无合格项则两项 NULL，不回退其他时间。输出下限在 usage、turn_aborted、回合开始、用户消息及工具结果边界推进到该行落盘时间，只增不减；边界或中断的时间早于下限或无法解析时整行忽略，不清首输出、不重置起点，普通边界严格晚于下限、或等于下限且尚无首输出时才重置；等于下限且已有首输出时整行忽略；turn_aborted 不早于下限就仍清空窗口；started_at_ms 必须 >= 下限，早到旧请求的晚到项直接忽略，中断无 usage 也同样保护。工具调用/命令执行/文件修改等生命周期项不作首输出或工具结果消息，工具专用请求可能没有首点；落盘与缓冲影响近似精度"

qwen_code:
  description: "Qwen Code CLI 工具与侧车账本 (token-usage / opus-usage)"
  locations:
    win32: "%USERPROFILE%\\.qwen\\usage"
    darwin: "~/.qwen/usage"
    linux: "~/.qwen/usage"
  file_pattern: "*-usage-*.jsonl"
  format: "JSONL (schemaVersion 1 驼峰格式为主，兼容旧版下划线)"
  key_fields:
    session_id: "$.sessionId 或 $.session_id"
    timestamp: "$.timestamp (ISO8601 或 Unix 戳)"
    model: "$.model"
    usage:
      input_tokens: "$.inputTokens / $.input_tokens / $.prompt_tokens；inputTokens 存在（含 NULL）时扣缓存，否则旧字段已是未缓存输入"
      output_tokens: "$.outputTokens / $.output_tokens / $.completion_tokens；thoughts 是否另加见 token_semantics"
      cache_read_tokens: "$.cachedTokens / $.cached_tokens / $.cache_read_tokens"
      cache_write_tokens: "$.cacheWriteTokens / $.cache_write_tokens / $.cache_creation_tokens"
  token_semantics:
    - "token 别名按列出的顺序逐字段取第一个非 NULL/undefined 的值，0 不回退；接受非负整数与去除首尾空白后的纯数字字符串，非法首选值不回退到其他别名。thoughts 同序取 thoughtsTokens / thoughts_tokens；缓存未知按未报缓存处理，扣减后输入不小于 0。适配器与 oracle 使用独立实现，不按整行选择命名格式。"
    - "outputTokens 来自 candidatesTokenCount，不存在对所有认证方式都成立的 thoughts 包含关系。QwenLM/qwen-code@99adce25e19dce4ea3bf90466ac84c8d6878becd 的 packages/core/src/telemetry/types.ts:404-425（ApiResponseEvent）逐字段透传；packages/core/src/services/tokenUsageService.ts:231-255（apiResponseEventToTokenUsageRecord）写入 outputTokens、thoughtsTokens、totalTokens。"
    - "同一上游 packages/core/src/core/openaiContentGenerator/converter.ts:1357-1474（convertOpenAIResponseToLlm）和 :1491-2009（convertOpenAIChunkToLlm）把 completion_tokens 写入 candidatesTokenCount，reasoning_tokens 单列到 thoughtsTokenCount（缺省时可能估算），不从 completion 中扣除；完整 completion 已含 reasoning，不能把其明细再加一次。openaiResponsesContentGenerator/responses-converter.ts:478-493（makeFinalResponse）同样透传 output_tokens 与其 reasoning 明细；completion 缺失或仅有估算时不保证可还原完整输出。"
    - "Gemini 原生 UsageMetadata 的 candidates 与 thoughts 分列；无 tool-use prompt 时 total = prompt + candidates + thoughts，须把 thoughts 并入账本 output。依据 https://ai.google.dev/api/generate-content#UsageMetadata（2026-11-01）；有独立 toolUsePromptTokenCount 时不能仅凭 total 的余量推断 thoughts。"
    - "最终规则（qwen PARSER_REV=7，适配器与独立 oracle 均实现）：authType 为 openai、openai-responses、qwen-oauth、anthropic 时输出取 rawOutput；rawOutput 未知且 thoughts>0 时取 thoughts 作为已知下界并记一次 bad_fields，无正 thoughts 则仍为 NULL。rawOutput 已知但小于 thoughts 时保留 rawOutput（含 0）并记一次 bad_fields；诊断先于零用量过滤。为 gemini、vertex-ai 时取 rawOutput + thoughts，忽略 total 的归属推断。相加时一项未知取另一已知项，两项未知才为 NULL；不把 tool-use prompt 的余量加到输出。"
    - "认证映射依据同一上游 packages/core/src/utils/auth-type.ts:8-15 与 core/contentGenerator.ts:553-604；qwen/qwenContentGenerator.ts:25-43 的 QwenContentGenerator 继承 OpenAIContentGenerator；core/anthropicContentGenerator/usage.ts:44-64 的 buildAnthropicUsageMetadata 保留完整 output 为 candidates，不额外登记 thoughts。"
    - "total 不一定是服务端自报：上游 tokenUsageService.ts:219-228（calculateTotalTokens）在 total 缺失或为 0 时回填 input + output + thoughts。已知认证不依赖 total；未知/缺失认证仅在 rawInput、rawOutput 均已知且 total 为正安全整数并等于 rawInput + rawOutput 时取 rawOutput，否则保留分列相加的兼容回退。rawInput 是扣缓存前的输入；未知认证的默认分列不是已证实的上游语义。"
  request_timing:
    timing_rev: 1
    fields: "apiDurationMs（毫秒）"
    method: "client_reported"
    scope: "request"
    limits: "completed；无独立首输出点；非正差值、单位不明或配对歧义 NULL"

deepseek_harness:
  description: "DeepSeek Harness (DSH) 本地任务会话记录"
  locations:
    win32: "%USERPROFILE%\\.dsh\\storages\\session_projcache\\sessions"
    darwin: "~/.dsh/storages/session_projcache/sessions"
    linux: "~/.dsh/storages/session_projcache/sessions"
  file_pattern: "*.json"
  format: "JSON (单个会话对象)"
  key_fields:
    session_id: "生产适配器取 basename(file, '.json')，仅剥除开头一个 session-；例如 session-<id>.json → <id>；不从 $.record.identity 取值"
    timestamp: "$.record.identity.createdAt (Unix ms)"
    ended_at: "$.record.rows.timeContext.val.lastMessageTime (Unix ms，最后一条消息)"
    model: "$.record.rows.modelSelection.val.lastUsed.model"
    usage:
      input_tokens: "$.record.rows.tokenUsage.val.totals.uncachedInputTokens"
      output_tokens: "$.record.rows.tokenUsage.val.totals.outputTokens"
      cache_read_tokens: "$.record.rows.tokenUsage.val.totals.cacheReadTokens"
      cache_write_tokens: "$.record.rows.tokenUsage.val.totals.cacheWriteTokens"
  identity_semantics:
    - "生产记录键为 dsh|<session_id>，kind=cumulative；token 数、模型和时间均不进入身份。依据 src/core/adapters/dsh.js:33-54。session- 来自文件 stem 的命名部分，不是从 identity 对象字段拼接；identity 对象在适配器中提供 createdAt 与 cwd。"
    - "独立 oracle/dsh.mjs 与生产适配器的 session ID 已对齐：同用 basename(file, '.json').replace(/^session-/, '')，不把字符串 identity 当 ID；没有前缀则保留 stem，重复前缀只剥一个。不再产生 session_filename_prefix issue；同会话多份累计快照仍按结束时间、文件路径取最新一份。"
    - "session- 是否属于客户端原始 ID 的上游生成函数未确认；消费侧按文件名剥一次前缀的规则固定。L3 历史归档的身份差异不代表当前 oracle 行为；全零快照是否保留的差异独立于身份规则。"

grok_build:
  description: "xAI Grok Build CLI 本地会话与用量事件"
  locations:
    win32: "%USERPROFILE%\\.grok\\sessions"
    darwin: "~/.grok/sessions"
    linux: "~/.grok/sessions"
  file_pattern: "*/*/updates.jsonl"
  format: "JSONL"
  key_fields:
    session_id: "$.params.sessionId"
    timestamp: "$.timestamp 或 $._meta.agentTimestampMs"
    event_type: "$.params.update.sessionUpdate == 'turn_completed'"
    usage:
      input_tokens: "$.params.update.usage.inputTokens (或 input_tokens)"
      output_tokens: "$.params.update.usage.outputTokens (或 output_tokens)"
      cache_read_tokens: "$.params.update.usage.cachedReadTokens (或 cache_read_input_tokens)"
      cache_write_tokens: "$.params.update.usage.cachedWriteTokens (或 cache_creation_tokens)"
    model: "同级 summary.json 中的 current_model_id 或 grok-4"
  request_timing:
    timing_rev: 1
    fields: "params._meta.agentTimestampMs 的首个 user_message_chunk/首个非空 agent_message_chunk；turn_completed.usage.apiDurationMs（毫秒）"
    method: "首字 log_timestamps；整次 client_reported"
    scope: "turn"
    limits: "回合独立汇总和覆盖率；不混入请求分位数；无生成时长；非正差值、单位不明或配对歧义 NULL"

aider:
  description: "Aider 终端 AI 编程助手交互日志 (.aider.llm.history)"
  locations:
    project_level:
      all: ".aider.llm.history"
    global_level:
      win32: "%USERPROFILE%\\.aider.llm.history"
      darwin: "~/.aider.llm.history"
      linux: "~/.aider.llm.history"
  file_pattern: "**/.aider.llm.history"
  format: "JSONL"
  key_fields:
    model: "$.model 或 $.response.model"
    timestamp: "$.timestamp 或 $.created"
    usage:
      input_tokens: "$.usage.prompt_tokens 或 $.usage.input_tokens"
      output_tokens: "$.usage.completion_tokens 或 $.usage.output_tokens"
      cache_read_tokens: "$.usage.cache_read_input_tokens 或 $.usage.prompt_tokens_details.cached_tokens"
      cache_write_tokens: "$.usage.cache_creation_input_tokens"

pi_agent:
  description: "Pi (Pi Coding Agent Harness) 本地会话交互日志"
  locations:
    win32: "%USERPROFILE%\\.pi\\agent\\sessions"
    darwin: "~/.pi/agent/sessions"
    linux: "~/.pi/agent/sessions"
  file_pattern: "**/*.jsonl"
  evidence: "2026-10-26 只读核对真实 sessions 目录：会话文件既有在一层子目录下的，也有在三层子目录下的，因此保留递归发现"
  format: "JSONL"
  provider_evidence:
    - "https://github.com/badlogic/pi-mono/blob/6c384aa30f619d7b28963f2bab24d8dacbe73cb6/packages/ai/src/types.ts#L585-L590"
    - "https://github.com/badlogic/pi-mono/blob/6c384aa30f619d7b28963f2bab24d8dacbe73cb6/packages/coding-agent/src/core/session-manager.ts#L74-L78"
  key_fields:
    provider: "$.message.provider；消息未自报 model 时可随 model_change.modelId 继承该行 provider；新 model_change 缺 provider 会清空，消息自报模型不借用旧提供方"
    session_id: "首行 type=='session' 的 id，或文件名提取"
    model: "$.message.model 或 model_change 事件的 modelId"
    timestamp: "$.timestamp 或 $.message.timestamp"
    usage:
      input_tokens: "$.message.usage.input"
      output_tokens: "$.message.usage.output"
      cache_read_tokens: "$.message.usage.cacheRead"
      cache_write_tokens: "$.message.usage.cacheWrite"
  request_timing:
    timing_rev: 1
    fields: "message.durationMs（毫秒）；缺失时外层 timestamp - message.timestamp（Unix 毫秒）"
    method: "client_reported / log_timestamps"
    scope: "request"
    limits: "stop/length/toolUse completed；error failed；aborted cancelled；其余 unknown；显式无效不回退；非正差值、单位不明或配对歧义 NULL"

hermes_agent:
  description: "Hermes Agent 本地状态与用量数据库 (state.db)"
  locations:
    win32: "%LOCALAPPDATA%\\hermes\\state.db"
    darwin: "~/.hermes/state.db"
    linux: "~/.hermes/state.db"
  file_pattern: "state.db"
  format: "SQLite"
  key_fields:
    table: "session_model_usage 或 sessions"
    session_id: "session_id (或 id)"
    model: "model"
    timestamp: "last_seen (或 first_seen / started_at)"
    usage:
      input_tokens: "input_tokens"
      output_tokens: "output_tokens"
      cache_read_tokens: "cache_read_tokens"
      cache_write_tokens: "cache_write_tokens"

cline_and_roo:
  description: "Cline 与 Roo Code (VS Code 扩展) 任务与 API 对话记录"
  locations:
    win32: "%APPDATA%\\{Code,Code - Insiders,VSCodium,Cursor}\\User\\globalStorage\\{saoudrizwan.claude-dev,rooveterinaryinc.roo-cline}\\tasks"
    darwin: "~/Library/Application Support/{Code,Code - Insiders,VSCodium,Cursor}/User/globalStorage/{saoudrizwan.claude-dev,rooveterinaryinc.roo-cline}/tasks"
    linux: "~/.config/{Code,Code - Insiders,VSCodium,Cursor}/User/globalStorage/{saoudrizwan.claude-dev,rooveterinaryinc.roo-cline}/tasks"
  file_pattern: "*/api_conversation_history.json"
  format: "JSON (Message 数组)"
  key_fields:
    session_id: "任务目录名 (taskId)"
    timestamp: "$.ts (Unix ms)"
    model: "$.model 或从同级 ui_messages.json 的 api_req_started 事件中反查"
    usage:
      input_tokens: "$.usage.input_tokens"
      output_tokens: "$.usage.output_tokens"
      cache_read_tokens: "$.usage.cache_read_input_tokens"
      cache_write_tokens: "$.usage.cache_creation_input_tokens"
  provenance: "未证实：Cline（c35b729049c7 及历史版本）与 Roo Code（b867ec914575）源码里没有找到写入 usage.* 的版本。当前 Cline SDK 版用量在 <sessionId>.messages.json 的 metrics.*（input 含缓存读写），经典版 3.39.2 起在 metrics.tokens（cached = 缓存读 + 写），更早只在 ui_messages.json 的 api_req_started；Roo Code 在 ui_messages.json 的 api_req_started，约 3.29.4 改过 tokensIn 口径且无版本标记。以上格式均未接入，等真实样本。"

gemini_cli:
  description: "Google 官方 Gemini CLI 会话与交互日志"
  locations:
    win32: "%USERPROFILE%\\.gemini\\sessions"
    darwin: "~/.gemini/sessions"
    linux: "~/.gemini/sessions"
  file_pattern: "**/*.{json,jsonl}"
  format: "JSON / JSONL"
  key_fields:
    session_id: "$.id 或文件名提取"
    timestamp: "$.startTime 或 $.createTime 或 $.timestamp"
    model: "$.model 或 $.modelId 或 model 回复中的 model 字段"
    usage:
      input_tokens: "$.usageMetadata.promptTokenCount (扣减 cachedContentTokenCount) 或 $.input_tokens"
      output_tokens: "$.usageMetadata.candidatesTokenCount 或 $.output_tokens"
      cache_read_tokens: "$.usageMetadata.cachedContentTokenCount 或 $.cache_read_tokens"

cursor:
