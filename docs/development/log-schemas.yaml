      headers: "Date, Model, Input (w/ Cache Write), Input (w/o Cache Write), Cache Read, Output Tokens, Total Tokens, Cost"

opencode:
  description: "OpenCode (anomalyco/opencode) 本地任务会话数据库 (opencode.db)"
  locations:
    win32: "%USERPROFILE%\\.local\\share\\opencode\\opencode.db（上游 global-roots.ts 各平台同一规则，不用 LOCALAPPDATA 或 APPDATA）"
    darwin: "~/.local/share/opencode/opencode.db（上游 packages/util/src/global-roots.ts 在 macOS 也用 XDG 数据目录，不用 Application Support）"
    linux: "~/.local/share/opencode/opencode.db"
  file_pattern: "opencode.db（或显式 OPENCODE_DB 指定的普通文件）"
