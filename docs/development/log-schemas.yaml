codebuddy_and_workbuddy:
  description: "CodeBuddy / WorkBuddy CLI 与桌面请求索引；第三方逆向依据，证据 B（合成）"
  upstream: "https://github.com/NextAgentX/qoder-trae-workbuddy-switch/blob/ab5afe42ef3b0e558ef279b4c9f01ede45ccc963/crates/buddy-switch-core/src/modules/token_stats.rs"
  evidence:
    - "第三方 token_stats.rs: usage、Totals::value、files、codebuddy_extension_data_dir、is_ide_conversation_index、ide_request_usage、ide_source"
  locations:
    win32: "CLI ~/{.codebuddy,.workbuddy,.workbuddy-ai}/projects；桌面 %LOCALAPPDATA%/CodeBuddyExtension/Data"
    darwin: "CLI ~/{.codebuddy,.workbuddy,.workbuddy-ai}/projects；桌面 ~/Library/Application Support/CodeBuddyExtension/Data"
    linux: "CLI ~/{.codebuddy,.workbuddy,.workbuddy-ai}/projects；桌面 ~/.local/share/CodeBuddyExtension/Data"
  discovery_pattern: "CLI projects/**/*.jsonl（跳过 subagents）；桌面 **/history/<workspace>/<conversation>/index.json，跳过 messages/check-point/backups/Public，不跟随目录链接"
  environment: "CODEBUDDY_HOME/WORKBUDDY_HOME 与旧 sessions/logs 路径无依据，不使用"
  format: "CLI JSONL；桌面 requests[].usage；不读 messages 正文"
  key_fields:
    identity: "CLI codebuddy|<文件名会话>|f<路径hash>:<物理行>；桌面 codebuddy|<会话目录>|<request.id>，缺 id 用文件hash+数组位置"
    session_id: "CLI 文件名；桌面会话目录名；不把 entry.id 当会话 ID"
    project_key: "CLI 明写 cwd 经 projectFromCwd；桌面 NULL，不从编码目录猜"
    model: "CLI providerData.model / model / message.model；桌面上级 workspace index.conversations 的 selectedModelId/modelId/model"
    provider: "第三方未验证持久化 provider 字段，NULL"
    timestamp: "CLI timestamp/ts；桌面 timestamp/ts/startedAt（毫秒或数字字符串）；兼容 ISO"
    usage:
      input_tokens: "优先 prompt_cache_miss_tokens（未缓存输入）；否则 input_tokens/inputTokens/prompt_tokens - cache_read"
      output_tokens: "output_tokens/outputTokens/completion_tokens"
      cache_read_tokens: "cache_read_input_tokens/cacheReadInputTokens/prompt_cache_hit_tokens/cached_tokens；支持 prompt_tokens_details.cached_tokens、inputTokensDetails[].cached_tokens；桌面另有 cacheTokens"
      cache_write_tokens: "cache_write_input_tokens/cacheWriteInputTokens/cache_creation_input_tokens/prompt_cache_write_tokens；也从其他 usage 与 providerData.rawUsage 补充；桌面另有 cachedWriteTokens；miss 绝不当 write"
    usage_scope: "CLI 只取 message.usage > providerData.usage > usage 一份输入输出；缓存正值优先于过时零别名；未知存 NULL；扣成负数记 bad_fields"
  limits: "第三方 Totals::value 表明 input 含缓存读、write 单列；CLI 无已验证消息 ID，移动/重排无法稳定去重；是否漏独有子任务用量未确认；同版本删行保留已采集值"

