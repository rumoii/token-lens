  file_pattern: "*/base_state.json，以及 */subagents/*/base_state.json、*/subagents/*/subagents/*/base_state.json 等；只沿 subagents/会话 精确迭代展开，不限深度，不跟随子目录链接，不收其他 JSON；中间缺状态仍发现后代"
  format: "JSON 覆写快照；关联相邻 events/event-<序号>-<事件 UUID>.json"
  key_fields:
    session_id: "$.id（conversation UUID）；不从文件路径猜身份"
    agent: "$.agent.kind = Agent；ACPAgent 不读"
    usage: "$.stats.usage_to_metrics[usageId].token_usages[]"
    identity: "openhands|<conversation>|<usageId>|<response_id>；三段分别 encodeURIComponent；同 usageId 内重复响应按列表出现顺序加 #2、#3，并计 duplicate_response_ids"
    timestamp: "事件 llm_response_id = TokenUsage.response_id，取有效 timestamp 的最早值；Event.timestamp 是 datetime.now().isoformat()，无时区时由 normalizeTimestamp 按采集机本地时区解释，精度到毫秒"
    model: "TokenUsage.model；不回填 metrics.model_name 或当前 agent.llm.model；缺失、空白、default、unknown 为 NULL"
    project_key: "NULL；workspace 不是进程 cwd"
    tokens:
      input_tokens: "prompt_tokens - cache_read_tokens - cache_write_tokens；任一项缺失或非法则 NULL；负结果计 bad_fields 并为 NULL，不夹成 0"
      output_tokens: "completion_tokens 原样，已含 reasoning_tokens，不再相加"
      cache_read_tokens: "cache_read_tokens"
      cache_write_tokens: "cache_write_tokens；SDK 1.28.1 来自 LiteLLM usage._cache_creation_input_tokens，不是后续 SDK 的 prompt_tokens_details.cache_creation_tokens"
    missing: "SDK TokenUsage 各 token 字段默认 0，已写出的 0 原样保留；文件实际缺键则 NULL，不能反推提供方是否报告过零缓存"
    excluded: "accumulated_token_usage、事件里的 stats 快照、completion logs 均不累计，也不回退"
  token_semantics: "kind=event；四类互不重叠；只记有响应 ID 且有匹配事件时间的逐次用量"
  limits:
    - "只计能在本会话自己的 events 里关联到的逐次用量；空 response_id 或没有有效匹配事件时不入账，不能用会话时间、mtime 或 Cost.timestamp 补请求时间"
    - "CLI 创建 agent、condenser；本版本不调用 fork、reset_metrics、ask_agent 或 generate_title。APIBasedCritic 不经 LLM metrics 记账。"
    - "子会话（task、delegate、agent hook）的用量从子会话自己的状态与 events 读取；父会话里的副本没有本会话事件，不重复计数；不按 usageId 前缀直接跳过，hook 自己的有效用量正常入账"
    - "未关联的 task:、delegate:、agent-hook: 条目计独立 note subagent_copies；其他未关联条目仍计 bad_times。前缀只分类 notes，不决定入账，也不要求复制入口唯一"
    - "task/delegate 位于当前父会话的 subagents/<子 UUID hex>，可继续嵌套；hook 位于当前父会话持久化目录的上一级根/<hook UUID hex>，有自己的 events；LocalConversation.close 不删除这些持久化文件"
    - "无时区时间依赖采集机时区；跨时区移动日志或采集机时区改变可能改变日期归属"
    - "ingest 每轮重读 base_state.json，不按 mtime 跳过；只有 events 变化也会在下次采集重新关联，无需改入口文件时间"
    - "只有合成验证，没有本机真实 OpenHands 样本；其他版本与运行方式未验收"
