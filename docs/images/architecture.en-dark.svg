<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img"><title>Token Lens</title><desc>Local tool logs are read by Rust adapters into a SQLite ledger and shown by the Flutter UI; only AI news, the exchange rate and the update check use the network, and their results go to the UI, never the ledger.</desc><rect width="1200" height="450" rx="16" fill="#181817"/><defs>
<marker id="hA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97757"/></marker>
<marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66645f"/></marker>
<filter id="sA" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
</defs><rect x="40" y="60" width="230" height="110" rx="12" fill="#1e1e1c" stroke="rgba(255,255,255,.08)" stroke-width="1" filter="url(#sA)"/>
<text x="155" y="98" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#eeede9">Local logs</text>
<text x="155" y="126" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#8e8c86">27 AI coding tools</text>
<text x="155" y="148" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#66645f">JSONL · JSON · SQLite</text><rect x="330" y="60" width="230" height="110" rx="12" fill="#1e1e1c" stroke="rgba(255,255,255,.08)" stroke-width="1" filter="url(#sA)"/>
<text x="445" y="98" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#eeede9">Rust adapters</text>
<text x="445" y="126" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#8e8c86">Four token types</text>
<text x="445" y="148" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#66645f">Re-reads never double count</text><rect x="620" y="60" width="230" height="110" rx="12" fill="#1e1e1c" stroke="#d97757" stroke-width="1.5" filter="url(#sA)"/>
<text x="735" y="98" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#eeede9">SQLite ledger</text>
<text x="735" y="126" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#8e8c86">ledger.db</text>
<text x="735" y="148" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#66645f">Micro-USD · timings stored apart</text><rect x="910" y="60" width="230" height="110" rx="12" fill="#1e1e1c" stroke="rgba(255,255,255,.08)" stroke-width="1" filter="url(#sA)"/>
<text x="1025" y="98" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#eeede9">Flutter UI</text>
<text x="1025" y="126" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#8e8c86">Stats and pricing in-process</text>
<text x="1025" y="148" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#66645f">No local web server</text><path d="M276 115H322" fill="none" stroke="#d97757" stroke-width="2"  marker-end="url(#hA)"/>
<text x="300" y="104" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#e8957a">read-only</text><path d="M566 115H612" fill="none" stroke="#d97757" stroke-width="2"  marker-end="url(#hA)"/>
<path d="M856 115H902" fill="none" stroke="#d97757" stroke-width="2"  marker-end="url(#hA)"/>
<rect x="330" y="214" width="810" height="132" rx="14" fill="none" stroke="rgba(255,255,255,.16)" stroke-dasharray="5 5"/>
<text x="346" y="232" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#8e8c86">Network (each news source can be turned off)</text><rect x="350" y="242" width="240" height="92" rx="12" fill="#1e1e1c" stroke="rgba(255,255,255,.08)" stroke-width="1" filter="url(#sA)"/>
<text x="470" y="280" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#eeede9">AI news</text>
<text x="470" y="308" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#8e8c86">Every 30 min while open</text>
<rect x="610" y="242" width="240" height="92" rx="12" fill="#1e1e1c" stroke="rgba(255,255,255,.08)" stroke-width="1" filter="url(#sA)"/>
<text x="730" y="280" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#eeede9">Exchange rate</text>
<text x="730" y="308" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#8e8c86">Only when you click Update</text>
<rect x="870" y="242" width="240" height="92" rx="12" fill="#1e1e1c" stroke="rgba(255,255,255,.08)" stroke-width="1" filter="url(#sA)"/>
<text x="990" y="280" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#eeede9">Update check</text>
<text x="990" y="308" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#8e8c86">At most once a day</text>
<path d="M1025 212V180" fill="none" stroke="#66645f" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#mA)"/>
<rect x="255.3599999999999" y="392" width="110.40000000000002" height="30" rx="15" fill="#2b1e19"/><text x="310.5599999999999" y="412" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#e8957a">No account</text><rect x="377.75999999999993" y="392" width="149.60000000000002" height="30" rx="15" fill="#2b1e19"/><text x="452.55999999999995" y="412" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#e8957a">No usage upload</text><rect x="539.3599999999999" y="392" width="126.08000000000003" height="30" rx="15" fill="#2b1e19"/><text x="602.3999999999999" y="412" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#e8957a">No telemetry</text><rect x="677.4399999999999" y="392" width="267.20000000000005" height="30" rx="15" fill="#2b1e19"/><text x="811.04" y="412" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#e8957a">Never edits other tools' files</text></svg>
