<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img"><title>Token Lens</title><desc>Local tool logs are read by Rust adapters into a SQLite ledger and shown by the Flutter UI; only AI news, the exchange rate, the price list and the update check use the network, and they only download; the downloaded price list is used to recalculate amounts in the ledger, the other results go to the UI only.</desc><rect width="1200" height="450" rx="16" fill="#fbfbf9"/><defs>
<marker id="hA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97757"/></marker>
<marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3a19b"/></marker>
<filter id="sA" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/></filter>
</defs><rect x="40" y="60" width="230" height="110" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="155" y="98" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">Local logs</text>
<text x="155" y="126" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">28 AI coding tools</text>
<text x="155" y="148" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#a3a19b">JSONL · JSON · SQLite</text><rect x="330" y="60" width="230" height="110" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="445" y="98" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">Rust adapters</text>
<text x="445" y="126" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">Four token types</text>
<text x="445" y="148" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#a3a19b">Re-reads never double count</text><rect x="620" y="60" width="230" height="110" rx="12" fill="#ffffff" stroke="#d97757" stroke-width="1.5" filter="url(#sA)"/>
<text x="735" y="98" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">SQLite ledger</text>
<text x="735" y="126" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">ledger.db</text>
<text x="735" y="148" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#a3a19b">Micro-USD · timings stored apart</text><rect x="910" y="60" width="230" height="110" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="1025" y="98" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">Flutter UI</text>
<text x="1025" y="126" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">Stats and pricing in-process</text>
<text x="1025" y="148" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#a3a19b">No local web server</text><path d="M276 115H322" fill="none" stroke="#d97757" stroke-width="2"  marker-end="url(#hA)"/>
<text x="300" y="104" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#b5532f">read-only</text><path d="M566 115H612" fill="none" stroke="#d97757" stroke-width="2"  marker-end="url(#hA)"/>
<path d="M856 115H902" fill="none" stroke="#d97757" stroke-width="2"  marker-end="url(#hA)"/>
<rect x="40" y="214" width="1100" height="132" rx="14" fill="none" stroke="rgba(27,26,24,.16)" stroke-dasharray="5 5"/>
<text x="56" y="232" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#75736d">Network (exchange rate only on click; the rest can be turned off in Settings)</text><rect x="58" y="242" width="254" height="92" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="185" y="280" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">AI news</text>
<text x="185" y="308" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">Every 30 min while open</text>
<rect x="330" y="242" width="254" height="92" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="457" y="280" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">Exchange rate</text>
<text x="457" y="308" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">Only when you click Update</text>
<rect x="602" y="242" width="254" height="92" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="729" y="280" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">Price list</text>
<text x="729" y="308" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">At most once a day, download only</text>
<rect x="874" y="242" width="254" height="92" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="1001" y="280" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">Update check</text>
<text x="1001" y="308" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">At most once a day</text>
