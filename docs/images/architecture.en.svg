<text x="765" y="200" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#a3a19b">reprices</text><path d="M1025 212V180" fill="none" stroke="#a3a19b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#mA)"/>
<rect x="255.3599999999999" y="392" width="110.40000000000002" height="30" rx="15" fill="#fbf1ec"/><text x="310.5599999999999" y="412" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#b5532f">No account</text><rect x="377.75999999999993" y="392" width="149.60000000000002" height="30" rx="15" fill="#fbf1ec"/><text x="452.55999999999995" y="412" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#b5532f">No usage upload</text><rect x="539.3599999999999" y="392" width="126.08000000000003" height="30" rx="15" fill="#fbf1ec"/><text x="602.3999999999999" y="412" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#b5532f">No telemetry</text><rect x="677.4399999999999" y="392" width="267.20000000000005" height="30" rx="15" fill="#fbf1ec"/><text x="811.04" y="412" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#b5532f">Never edits other tools' files</text></svg>
