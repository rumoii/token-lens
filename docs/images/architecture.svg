<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Token Lens 工作原理</title>
  <desc id="desc">适配器只读解析各 AI 编码工具写在本机的日志，归一成四类 token 后写入 SQLite 账本，按内容去重并以微美元计价；lens serve 只在 127.0.0.1 上提供 /api/v1，看板凭令牌读取；lens summary 在终端打印摘要。只有用户点击「更新汇率」时才联网。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eefbf6"/>
      <stop offset="1" stop-color="#e7effc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1d4a5c" flood-opacity="0.10"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a8f7b"/>
    </marker>
    <marker id="head-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a9bab"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
      .card { fill: #ffffff; filter: url(#shadow); }
      .name { font-size: 24px; font-weight: 700; fill: #16324a; }
      .note { font-size: 16px; fill: #5b7083; }
      .link { stroke: #2a8f7b; stroke-width: 2.5; fill: none; }
      .muted { stroke: #8a9bab; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
      .label-muted { font-size: 15px; font-weight: 600; fill: #6f8293; }
      .pill { fill: #d9f3ea; }
      .pill-text { font-size: 17px; font-weight: 700; fill: #22806d; }
    </style>
  </defs>

  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>

  <!-- 本地日志 -->
  <rect class="card" x="35" y="110" width="190" height="100" rx="18"/>
  <text class="name" x="130" y="152" text-anchor="middle">本地日志</text>
  <text class="note" x="130" y="182" text-anchor="middle">27 款 AI 编码工具</text>

  <!-- 适配器 -->
  <rect class="card" x="275" y="110" width="190" height="100" rx="18"/>
  <text class="name" x="370" y="152" text-anchor="middle">适配器</text>
  <text class="note" x="370" y="182" text-anchor="middle">只读 · 归一四类 token</text>

  <!-- 账本 -->
  <rect class="card" x="515" y="110" width="190" height="100" rx="18"/>
  <text class="name" x="610" y="152" text-anchor="middle">账本</text>
  <text class="note" x="610" y="182" text-anchor="middle">SQLite · 去重 · 计价</text>

  <!-- 本地服务 -->
  <rect class="card" x="755" y="110" width="190" height="100" rx="18"/>
  <text class="name" x="850" y="152" text-anchor="middle">lens serve</text>
  <text class="note" x="850" y="182" text-anchor="middle">/api/v1 · 仅 127.0.0.1</text>

  <!-- 看板 -->
  <rect class="card" x="995" y="110" width="170" height="100" rx="18"/>
  <text class="name" x="1080" y="152" text-anchor="middle">看板</text>
  <text class="note" x="1080" y="182" text-anchor="middle">浏览器 · 凭令牌</text>

  <!-- 终端摘要 -->
  <rect class="card" x="515" y="280" width="190" height="90" rx="18"/>
  <text class="name" x="610" y="318" text-anchor="middle">lens summary</text>
  <text class="note" x="610" y="346" text-anchor="middle">终端摘要</text>

  <!-- 汇率 -->
  <rect class="card" x="755" y="280" width="190" height="90" rx="18"/>
  <text class="name" x="850" y="318" text-anchor="middle">汇率</text>
  <text class="note" x="850" y="346" text-anchor="middle">点击时才联网</text>

  <!-- 连线 -->
  <path class="link" d="M237 160 H263" marker-end="url(#head)"/>
  <path class="link" d="M477 160 H503" marker-end="url(#head)"/>
  <path class="link" d="M717 160 H743" marker-end="url(#head)"/>
  <path class="link" d="M957 160 H983" marker-start="url(#head)" marker-end="url(#head)"/>
  <path class="link" d="M610 222 V268" marker-end="url(#head)"/>
  <path class="muted" d="M1080 222 V325 H957" marker-end="url(#head-muted)"/>
  <text class="label-muted" x="1094" y="280">手动</text>

  <!-- 底部标签 -->
  <rect class="pill" x="230" y="412" width="132" height="40" rx="20"/>
  <text class="pill-text" x="296" y="438" text-anchor="middle">没有账号</text>
  <rect class="pill" x="382" y="412" width="168" height="40" rx="20"/>
  <text class="pill-text" x="466" y="438" text-anchor="middle">不上传用量</text>
  <rect class="pill" x="570" y="412" width="132" height="40" rx="20"/>
  <text class="pill-text" x="636" y="438" text-anchor="middle">零遥测</text>
  <rect class="pill" x="722" y="412" width="248" height="40" rx="20"/>
  <text class="pill-text" x="846" y="438" text-anchor="middle">不改动其他工具的配置</text>
</svg>
