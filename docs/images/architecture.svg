<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img"><title>Token Lens</title><desc>各工具的本机日志只读进入 Rust 适配器，写进 SQLite 账本，再由 Flutter 界面显示；联网只有 AI 热点、汇率和检查更新三处，结果只给界面用，不进账本。</desc><rect width="1200" height="450" rx="16" fill="#fbfbf9"/><defs>
<marker id="hA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97757"/></marker>
<marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3a19b"/></marker>
<filter id="sA" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/></filter>
</defs><rect x="40" y="60" width="230" height="110" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="155" y="98" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">本机日志</text>
<text x="155" y="126" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">27 款 AI 编程工具</text>
<text x="155" y="148" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#a3a19b">JSONL · JSON · SQLite</text><rect x="330" y="60" width="230" height="110" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="445" y="98" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">Rust 适配器</text>
<text x="445" y="126" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">归一成四类 token</text>
<text x="445" y="148" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#a3a19b">重复读取不重复计数</text><rect x="620" y="60" width="230" height="110" rx="12" fill="#ffffff" stroke="#d97757" stroke-width="1.5" filter="url(#sA)"/>
<text x="735" y="98" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">SQLite 账本</text>
<text x="735" y="126" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">ledger.db</text>
<text x="735" y="148" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#a3a19b">金额按微美元记，请求计时单独存</text><rect x="910" y="60" width="230" height="110" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="1025" y="98" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">Flutter 界面</text>
<text x="1025" y="126" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">统计、计价在进程内完成</text>
<text x="1025" y="148" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#a3a19b">没有本地网页服务</text><path d="M276 115H322" fill="none" stroke="#d97757" stroke-width="2"  marker-end="url(#hA)"/>
<text x="300" y="104" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#b5532f">只读</text><path d="M566 115H612" fill="none" stroke="#d97757" stroke-width="2"  marker-end="url(#hA)"/>
<path d="M856 115H902" fill="none" stroke="#d97757" stroke-width="2"  marker-end="url(#hA)"/>
<rect x="330" y="214" width="810" height="132" rx="14" fill="none" stroke="rgba(27,26,24,.16)" stroke-dasharray="5 5"/>
<text x="346" y="232" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#75736d">联网（新闻来源可以逐个停用）</text><rect x="350" y="242" width="240" height="92" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="470" y="280" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">AI 热点</text>
<text x="470" y="308" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">程序开着时每 30 分钟刷新</text>
<rect x="610" y="242" width="240" height="92" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="730" y="280" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">汇率</text>
<text x="730" y="308" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">点「更新汇率」时才请求</text>
<rect x="870" y="242" width="240" height="92" rx="12" fill="#ffffff" stroke="rgba(27,26,24,.10)" stroke-width="1" filter="url(#sA)"/>
<text x="990" y="280" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif" font-size="21" font-weight="600" fill="#171716">检查更新</text>
<text x="990" y="308" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14.5" fill="#75736d">每天最多一次</text>
<path d="M1025 212V180" fill="none" stroke="#a3a19b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#mA)"/>
<rect x="371" y="392" width="74" height="30" rx="15" fill="#fbf1ec"/><text x="408" y="412" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#b5532f">不登录</text><rect x="457" y="392" width="102" height="30" rx="15" fill="#fbf1ec"/><text x="508" y="412" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#b5532f">不上传用量</text><rect x="571" y="392" width="88" height="30" rx="15" fill="#fbf1ec"/><text x="615" y="412" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#b5532f">没有遥测</text><rect x="671" y="392" width="158" height="30" rx="15" fill="#fbf1ec"/><text x="750" y="412" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#b5532f">不改其他工具的文件</text></svg>
